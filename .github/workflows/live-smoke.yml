name: Live API smoke

# Runs against the real OpenAI API to catch upstream drift (model deprecations,
# response-shape changes, new required fields). Cheap — every test uses gpt-4o-mini
# or text-embedding-3-small with max_completion_tokens=20.
#
# Setup: add `OPENAI_API_KEY` as a repository secret
#   (Settings → Secrets and variables → Actions → New repository secret).
#
# Failure here usually means OpenAI changed something — read the diff carefully.

on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Don't fail on warnings here — the regular CI already does that.

jobs:
  live-smoke:
    name: live-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check OPENAI_API_KEY secret is set
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY repository secret not set — skipping live smoke tests."
            echo "OPENAI_KEY_SET=false" >> "$GITHUB_ENV"
          else
            echo "OPENAI_KEY_SET=true" >> "$GITHUB_ENV"
          fi
      - if: env.OPENAI_KEY_SET == 'true'
        uses: actions/checkout@v4
      - if: env.OPENAI_KEY_SET == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: env.OPENAI_KEY_SET == 'true'
        uses: Swatinem/rust-cache@v2
      - if: env.OPENAI_KEY_SET == 'true'
        name: Run live smoke tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: cargo test --test live_smoke -- --ignored --nocapture
